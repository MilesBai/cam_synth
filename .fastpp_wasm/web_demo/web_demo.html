<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>FAST++ Keypoints Demo</title>

    <style>
        body {
            background: #111;
            margin: 0;
            padding: 16px;
            font-family: monospace;
            color: #ccc;
        }

        #cameraWrap {
            position: relative;
            display: inline-block;
        }

        #video,
        #overlay {
            width: 640px;
            height: 480px;
        }

        #overlay {
            position: absolute;
            left: 0;
            top: 0;
            pointer-events: none;
            display: none;
        }

        #info {
            margin-top: 8px;
            padding: 4px 8px;
            background: #1a1a1a;
            border-radius: 4px;
            color: #00ff88;
        }
    </style>
</head>

<body>

    <div id="cameraWrap">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
    </div>
    <div id="info">Initializing WASM...</div>

    <script src="fastpp.js"></script>
    <script>

        const MAX_POINTS = 200;

        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const info = document.getElementById('info');

        // Offscreen canvas for extracting video pixel data each frame
        const offscreen = document.createElement('canvas');
        const offCtx = offscreen.getContext('2d');

        let fastppMod = null;

        // Persistent WASM heap buffers, reallocated only on resolution change
        let rgbPtr = 0, outPtr = 0;
        let allocW = 0, allocH = 0;

        async function init() {
            fastppMod = await FastppModule();
            info.textContent = 'WASM ready — waiting for camera...';
            await startCamera();
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                overlay.width = video.videoWidth;
                overlay.height = video.videoHeight;
                offscreen.width = video.videoWidth;
                offscreen.height = video.videoHeight;
                overlay.style.display = 'block';
                requestAnimationFrame(detectAndDraw);
            };
        }

        function ensureBuffers(w, h) {
            if (allocW === w && allocH === h) return;
            if (rgbPtr) fastppMod._free(rgbPtr);
            if (outPtr) fastppMod._free(outPtr);
            rgbPtr = fastppMod._malloc(w * h * 3);
            outPtr = fastppMod._malloc(MAX_POINTS * 4 * 4); // 4 floats × MAX_POINTS
            allocW = w;
            allocH = h;
        }

        function detectKeypoints() {
            const w = video.videoWidth;
            const h = video.videoHeight;
            if (!w || !h) return [];

            ensureBuffers(w, h);

            // Capture current video frame into offscreen canvas
            offCtx.drawImage(video, 0, 0, w, h);
            const rgba = offCtx.getImageData(0, 0, w, h).data;

            // Convert RGBA → RGB directly in the WASM heap
            const heap = fastppMod.HEAPU8;
            for (let i = 0; i < w * h; i++) {
                heap[rgbPtr + i * 3]     = rgba[i * 4];
                heap[rgbPtr + i * 3 + 1] = rgba[i * 4 + 1];
                heap[rgbPtr + i * 3 + 2] = rgba[i * 4 + 2];
            }

            const t0 = performance.now();
            const count = fastppMod._fastpp(w, h, rgbPtr, MAX_POINTS, outPtr);
            const elapsed = (performance.now() - t0).toFixed(1);

            // Read back keypoints: each is [x, y, angle, score] as float32
            const floats = fastppMod.HEAPF32;
            const base = outPtr >> 2; // byte offset → float32 index
            const keypoints = [];
            for (let i = 0; i < count; i++) {
                keypoints.push({
                    x:     floats[base + i * 4],
                    y:     floats[base + i * 4 + 1],
                    angle: floats[base + i * 4 + 2],
                    score: floats[base + i * 4 + 3],
                });
            }

            info.textContent = `${count} keypoints  |  ${elapsed} ms  |  ${w}×${h}`;
            return keypoints;
        }

        function drawKeypoints(keypoints) {
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            for (const { x, y, angle } of keypoints) {
                ctx.save();

                ctx.shadowBlur = 6;
                ctx.shadowColor = '#00ff88';

                // Filled circle at keypoint location
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#00ff88';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // Orientation line
                const len = 16;
                const ax = x + len * Math.cos(angle);
                const ay = y + len * Math.sin(angle);

                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(ax, ay);
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Arrowhead
                const as = 5;
                ctx.beginPath();
                ctx.moveTo(ax, ay);
                ctx.lineTo(ax - as * Math.cos(angle - Math.PI / 6), ay - as * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(ax - as * Math.cos(angle + Math.PI / 6), ay - as * Math.sin(angle + Math.PI / 6));
                ctx.closePath();
                ctx.fillStyle = '#00ff88';
                ctx.fill();

                ctx.restore();
            }
        }

        function detectAndDraw() {
            if (fastppMod && video.readyState >= 2) {
                drawKeypoints(detectKeypoints());
            }
            requestAnimationFrame(detectAndDraw);
        }

        init();

    </script>

</body>

</html>
